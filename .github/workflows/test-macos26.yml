name: Test Export on macOS 15 and 26

on:
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
    inputs:
      input_image:
        description: "Input HDR image to export (repo-relative path)"
        required: false
        default: TestAssets/test_in_desert.png

jobs:
  test-cli-export:
    name: Test on ${{ matrix.os_label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            os_label: macos26
          - runner: macos-15
            os_label: macos15-arm
          - runner: macos-15-intel
            os_label: macos15-intel

    env:
      OS_LABEL: ${{ matrix.os_label }}
      INPUT: ${{ inputs.input_image }}
      RESULTS_DIR: TestAssets/results

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "26.2" # latest-stable

    - name: Display system information
      run: |
        echo "=== System Information ==="
        sw_vers || true
        echo ""
        echo "=== Xcode Version ==="
        xcodebuild -version || true
        echo ""
        echo "=== Metal Support ==="
        system_profiler SPDisplaysDataType 2>/dev/null | grep -i "metal" || echo "Metal info not available"

    - name: Verify test HDR image exists
      run: |
        if [ -f "$INPUT" ]; then
          echo "✅ Test HDR image found: $INPUT"
          ls -lh "$INPUT"
        else
          echo "❌ Test HDR image not found: $INPUT (make sure it is committed via Git LFS)."
          exit 1
        fi
        # Output filename prefix derived from the input basename (no extension), so different
        # inputs produce distinctly-named artifacts (e.g. test_in_desert_… vs test_in_…).
        base=$(basename "$INPUT"); base=${base%.*}
        echo "PREFIX=$base" >> "$GITHUB_ENV"
        echo "ℹ️ Output prefix: $base"

    # Xcode 26 ships the Metal toolchain as a separate downloadable component; the build
    # compiles HistogramShaders.metal, so fetch it first (no-op if already installed).
    - name: Download Metal toolchain
      run: xcodebuild -downloadComponent MetalToolchain

    - name: Build CLI tool
      run: |
        echo "🔨 Building HDR2gainmapCLI..."
        xcodebuild \
          -project HDR2gainmapApp.xcodeproj \
          -scheme HDR2gainmapCLI \
          -configuration Release \
          -derivedDataPath ./build \
          clean build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Locate CLI binary
      id: cli_path
      run: |
        CLI_PATH=$(find ./build/Build/Products/Release -name "HDR2gainmapCLI" -type f | head -n 1)
        echo "cli_path=$CLI_PATH" >> $GITHUB_OUTPUT
        echo "✅ Found CLI at: $CLI_PATH"
        chmod +x "$CLI_PATH"

    # Export the same input six ways — {full, half} gain-map resolution × three gain-map kinds:
    #   monoCI     = luma gain map computed by Core Image (aux tagged PQ by Core Image)
    #   monoManual = luma gain map we hand-assemble, aux tagged Display P3 by us (--mono-manual)
    #   rgb        = 3-channel gain map we hand-assemble, aux Display P3 (--rgb)
    # Always with Auto tone-mapping. HEIC quality is left unset so the engine uses its 0.95 default.
    #
    # The CLI writes the gainMapRGB / gainMapMonoManual keys explicitly on EVERY invocation (both the
    # true and false case), so each run is deterministic regardless of residual UserDefaults state —
    # order no longer matters for correctness. We still pass --gainmap-subsample explicitly each run.
    - name: Run export tests (6 combinations)
      run: |
        set -euo pipefail
        CLI="${{ steps.cli_path.outputs.cli_path }}"
        mkdir -p "$RESULTS_DIR"

        run() {
          local res="$1" ch="$2"; shift 2
          local out="$RESULTS_DIR/${PREFIX}_${OS_LABEL}_${res}_${ch}_auto_q95.heic"
          echo "::group::export ${res} ${ch} → $out"
          "$CLI" "$INPUT" "$out" --auto --verbose "$@"
          echo "::endgroup::"
        }

        run full monoCI     --gainmap-subsample=1
        run half monoCI     --gainmap-subsample=2
        run full monoManual --gainmap-subsample=1 --mono-manual
        run half monoManual --gainmap-subsample=2 --mono-manual
        run full rgb        --gainmap-subsample=1 --rgb
        run half rgb        --gainmap-subsample=2 --rgb

        echo "📦 Produced:"
        ls -lh "$RESULTS_DIR"/${PREFIX}_${OS_LABEL}_*.heic

    - name: Verify exported images
      run: |
        set -uo pipefail
        fail=0
        for f in "$RESULTS_DIR"/${PREFIX}_${OS_LABEL}_*.heic; do
          echo "::group::verify $f"
          if swift Scripts/verify_export.swift "$f"; then
            echo "✅ $f"
          else
            echo "❌ $f FAILED verification"
            fail=1
          fi
          echo "::endgroup::"
        done
        if [ "$fail" -ne 0 ]; then
          echo "❌ One or more outputs failed verification"
          exit 1
        fi
        echo "✅ All outputs verified"

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs-${{ env.PREFIX }}-${{ matrix.os_label }}
        path: ${{ env.RESULTS_DIR }}/${{ env.PREFIX }}_${{ matrix.os_label }}_*.heic
        retention-days: 7
