name: Test Export on macOS 15 and 26

on:
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  test-cli-export-macos26:
    name: Test on macOS 26
    runs-on: macos-26
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install & verify MetalToolchain (Xcode 26+)
      run: |
        set -euo pipefail

        echo "Xcode:"
        xcodebuild -version
        echo "DEVELOPER_DIR=$DEVELOPER_DIR"
        xcrun --find metal || true

        echo "Downloading MetalToolchain..."
        sudo xcodebuild -downloadComponent MetalToolchain

        echo "Verifying metal works (compile a tiny shader)..."
        cat > /tmp/ci_test.metal <<'EOF'
        #include <metal_stdlib>
        using namespace metal;
        kernel void k(device float* a [[buffer(0)]], uint id [[thread_position_in_grid]]) { a[id]=a[id]; }
        EOF
        xcrun metal -c /tmp/ci_test.metal -o /tmp/ci_test.air
    
    - name: Display system information
      run: |
        echo "=== System Information ==="
        sw_vers || true
        echo ""
        echo "=== Xcode Version ==="
        xcodebuild -version || true
        echo ""
        echo "=== Metal Support ==="
        system_profiler SPDisplaysDataType 2>/dev/null | grep -i "metal" || echo "Metal info not available"
        echo ""
        echo "=== GPU Information ==="
        system_profiler SPDisplaysDataType 2>/dev/null | grep -i "chipset" || echo "GPU info not available"
    
    # ✅ Verifica semplicemente che il file committato esista
    - name: Verify test HDR image exists
      run: |
        if [ -f "TestAssets/test_in.png" ]; then
          echo "✅ Test HDR image found: TestAssets/test_in.png"
          ls -lh TestAssets/test_in.png
        else
          echo "❌ Test HDR image not found in repository!"
          echo "Make sure TestAssets/test_in.png is committed."
          exit 1
        fi
    
    - name: Build CLI tool
      run: |
        echo "🔨 Building HDR2gainmapCLI..."
        xcodebuild \
          -project HDR2gainmapApp.xcodeproj \
          -scheme HDR2gainmapCLI \
          -configuration Release \
          -derivedDataPath ./build \
          clean build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Locate CLI binary
      id: cli_path
      run: |
        CLI_PATH=$(find ./build/Build/Products/Release -name "HDR2gainmapCLI" -type f | head -n 1)
        echo "cli_path=$CLI_PATH" >> $GITHUB_OUTPUT
        echo "✅ Found CLI at: $CLI_PATH"
        chmod +x "$CLI_PATH"
    
    - name: Run export test
      run: |
        CLI_PATH="${{ steps.cli_path.outputs.cli_path }}"
        
        echo "🧪 Running export test..."
        "$CLI_PATH" \
          TestAssets/test_in.png \
          TestAssets/test_out_macos26.heic \
          --verbose
    
    - name: Verify exported image with standalone script
      run: |
        echo "🔍 Running standalone verification..."
        swift Scripts/verify_export.swift TestAssets/test_out_macos26.heic
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs-macos26
        path: |
          TestAssets/test_out_macos26.heic
        retention-days: 7
    
    # - name: Setup tmate debug session
    #   if: failure()
    #   uses: mxschmitt/action-tmate@v3
    #   timeout-minutes: 30
    #   with:
    #     limit-access-to-actor: true

